<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Rim -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.35"/>
  
  <!-- Motorcycle Gear & Wings Silhouette -->
  <g transform="translate(256, 230)" filter="url(#glow)">
    <!-- Central Motorcycle / Piston / Helmet shape -->
    <!-- Speed Wings -->
    <path d="M-190,-40 C-110,-70 -50,-60 0,-10 C50,-60 110,-70 190,-40 C140,-10 90,10 0,60 C-90,10 -140,-10 -190,-40 Z" fill="url(#goldGrad)" opacity="0.25"/>
    
    <!-- Central Sport Motorcycle Silhouette -->
    <circle cx="-90" cy="55" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>
    <circle cx="-90" cy="55" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
    <circle cx="90" cy="55" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>
    <circle cx="90" cy="55" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
    
    <!-- Motorcycle Body Frame -->
    <path d="M-90,55 L-40,10 L30,10 L90,55 M-40,10 L-10,-45 L40,-45 L70,-10 L90,55 M-10,-45 L20,-15 L-20,35 Z" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Handlebar & Headlight -->
    <path d="M25,-55 L45,-45 L65,-50" fill="none" stroke="#fef08a" stroke-width="10" stroke-linecap="round"/>
    <polygon points="55,-40 90,-25 55,-10" fill="#fef08a" opacity="0.9"/>
    
    <!-- Rider Helmet -->
    <circle cx="5" cy="-60" r="24" fill="url(#goldGrad)"/>
    <path d="M-5,-62 Q15,-66 26,-55" stroke="#090d16" stroke-width="5" stroke-linecap="round"/>
  </g>
  
  <!-- Brand Name Typography -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">MOTOS BOW</text>
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#94a3b8" text-anchor="middle" letter-spacing="8">REPUESTOS &amp; APK</text>
</svg>
